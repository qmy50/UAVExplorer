# odom_topic: "/drone_0_visual_slam/odom"
# odom_topic: "/iris_0/my_odom"
odom_topic: "/drone_0_visual_slam/odom"
local_region_min: [-3, -3, -0.6]
local_region_max: [2, 2, 0.6]
global_region_min: [-15, -15, 0.8]
global_region_max: [15, 15, 2]
local_sample_thresh: 100  # 局部采样失败上限
global_sample_thresh: 50
frontier_sample_thresh: 100
dist_thresh: 0.6
safe_distance_xy: 0.2
safe_distance_z: 0.0
safe_distance_check_unknown: true # true will make node sampling conservative but safe 

# Camera Parameters
horizontal_FOV: 0.8
vertical_FOV: 1.57
dmin: 0
dmax: 1.5

nearest_neighbor_number: 15
frontier_nearest_neighbor_number: 15
max_connect_dist: 1.6
num_yaw_angles: 32

# Goal Candidate
min_voxel_thresh: 0.5
min_goal_candidates: 4
max_goal_candidates: 30
information_gain_update_distance: 2.0
yaw_penalty_weight: 4.5

# Semantic Value Map (ValueMap2D)
use_value_map: true          # Enable/disable semantic value map
semantic_weight: 350         # Weight for semantic value in path scoring
# candidate_semantic_weight: 0.5
candidate_semantic_weight: 2.5

# frontier detection
cluster_size_xy: 1.0
min_cluster_cells: 5
min_frontier_size: 0.5
min_frontier_center_dist: 2.0
yaw_replan_threshold_deg: 120.0
candidate_frontier_weight: 0.15
use_8neighbor_frontier: true

