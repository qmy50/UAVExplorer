defaults:
  - /benchmark/nav/objectnav:
      - objectnav_hm3d
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    split: val
    data_path: data/datasets/objectnav/hm3d/v2/{split}/{split}.json.gz # HM3D-v2 dataset
  environment:
    max_episode_steps: 1000
    iterator_options:
      cycle: false
      shuffle: true
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      gps_sensor:
        type: GPSSensor
        dimensionality: 3
    measurements:
      success:
        success_distance: 0.3
  simulator:
    habitat_sim_v0:
      allow_sliding: true
    forward_step_size: 0.125     # Coarse: 0.25 | Fine: 0.1
    turn_angle: 10              # Coarse: 30   | Fine: 10
    agents:
      main_agent:
        height: 0.5
        radius: 0.18
        sim_sensors:
          rgb_sensor:
            position: [0, 0.5, 0]
          depth_sensor:
            position: [0, 0.5, 0]
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true

# ── VLM / ITM control ──
use_vlm: true
use_itm: true
use_point_cloud: false
use_visualize: true      # 实时检测可视化 → /yolo_detector/visualization

detector:
  yolo:
    confidence_threshold_yolo: 0.45
    iou_threshold_yolo: 0.6
    agnostic_nms: True

  groundingDINO:
    confidence_threshold_dino: 0.40
    text_threshold: 0.25

llm:
  llm_answer_path: llm/answers/llm_answer_hm3d.txt
  llm_response_path: llm/answers/llm_responses.txt
  llm_client: deepseek  # deepseek, ollama or none

record_file_name: "record.txt"
continue_file_name: "continue.txt"
need_video: false
video_output_path: "videos/test_hm3dv2_{split}"
test_epi_num: -1
